baseURL: "https://taelee1085.github.io/"
languageCode: "en-us"
title: "Kyungtae Lee"
theme: "PaperMod"

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
  tag: tags

# The tag taxonomy is declared above but no content uses it, so Hugo would emit an
# empty /tags/ page into sitemap.xml. Disabling the kinds suppresses it without
# restoring Hugo's default taxonomies (which would add an empty /categories/ too).
disableKinds: ["taxonomy", "term", "rss"]

minify:
  disableXML: true

menu:
  main:
    - name: Research
      url: research/
      weight: 1
    - name: Teaching
      url: teaching/
      weight: 2
    - name: CV
      url: kyungtae-lee-cv.pdf
      weight: 3

params:
  description: "Kyungtae (Tae) Lee, Economics Ph.D. candidate at CUNY Graduate Center. Econometrics, development, energy, and environmental economics. Research, teaching, CV."
  author: "Kyungtae (Tae) Lee"
  DateFormat: "January 2006"
  defaultTheme: light
  disableThemeToggle: true
  hideFooter: false
  ShowShareButtons: false
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  disableScrollToTop: true
  comments: false
  math: true
  profileMode:
    enabled: true
    title: "Kyungtae (Tae) Lee"
    subtitle: "I am a Ph.D. candidate in Economics at CUNY Graduate Center. My research lies in econometrics, development economics, and energy and environmental economics.<br>Email: [kyungtae.lee79@gc.cuny.edu](mailto:kyungtae.lee79@gc.cuny.edu)"
    imageUrl: "profile.jpg"
    imageWidth: 160
    imageHeight: 160
    imageTitle: "Kyungtae (Tae) Lee"
    buttons:
      - name: Research
        url: research/
      - name: Teaching
        url: teaching/
      - name: CV
        url: kyungtae-lee-cv.pdf
  socialIcons:
    - name: email
      url: "mailto:kyungtae.lee79@gc.cuny.edu"
    - name: orcid
      url: "https://orcid.org/0009-0009-4661-9638"
  # Google Search Console ownership check (URL-prefix property https://taelee1085.github.io/,
  # "HTML tag" method). PaperMod emits it as <meta name="google-site-verification"> on every
  # page. Public by design, not a secret. Removing it un-verifies the property.
  analytics:
    google:
      SiteVerificationTag: "75vop6L0a0jh-daF2CzpfVs4hfuJqMHnW_Eo1pnCUCI"

markup:
  goldmark:
    renderer:
      unsafe: true
